name: Assignment portal lab

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this push
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run real tests and generate JSON report
        run: python3 scripts/run_tests.py
      - name: Preserve actual JSON report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-report.json
          if-no-files-found: error

  send-email:
    needs: test-and-report
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      REPORT_TOKEN: ${{ secrets.LOCAL_REPORT_TOKEN }}
      REPORT_RECEIVER_URL: ${{ secrets.REPORT_RECEIVER_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      SMTP_TO: ${{ secrets.SMTP_TO }}
    steps:
      - name: Check out this push
        uses: actions/checkout@v4
      - name: Download actual JSON report
        uses: actions/download-artifact@v4
        with:
          name: test-report-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate report delivery configuration
        if: ${{ env.REPORT_TOKEN != '' && env.REPORT_RECEIVER_URL != '' }}
        run: |
          test -n "$REPORT_TOKEN" || { echo "LOCAL_REPORT_TOKEN is not configured"; exit 1; }
          test -n "$REPORT_RECEIVER_URL" || { echo "REPORT_RECEIVER_URL is not configured"; exit 1; }
      - name: Deliver report to local receiver through tunnel
        if: ${{ env.REPORT_TOKEN != '' && env.REPORT_RECEIVER_URL != '' }}
        run: python3 scripts/send_report.py
      - name: Optionally email actual test report
        if: ${{ env.SMTP_HOST != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.SMTP_FROM != '' && env.SMTP_TO != '' }}
        run: python3 scripts/email_report.py

  deploy-pages:
    needs: [test-and-report, send-email]
    if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out this push
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - name: Deploy static frontend
        id: deployment
        uses: actions/deploy-pages@v4
