<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignment Portal</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">DevOps lab · Assignment submissions</p>
      <h1>Assignment Portal</h1>
      <p id="mode-label" class="mode" role="status">Connecting to the portal…</p>
    </header>
    <section aria-labelledby="form-heading" class="panel">
      <h2 id="form-heading">Submit your assignment</h2>
      <p>All five fields are required. Share an HTTP or HTTPS link, not a file upload.</p>
      <form id="submission-form" novalidate>
        <div class="field">
          <label for="name">Name / Username</label>
          <input id="name" name="name" autocomplete="name" placeholder="Enter your name or username" required maxlength="120" aria-describedby="name-error">
          <p id="name-error" class="field-error"></p>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@gmail.com" required maxlength="254" aria-describedby="email-error">
          <p id="email-error" class="field-error"></p>
        </div>
        <div class="field">
          <label for="registration_number">Registration number</label>
          <input id="registration_number" name="registration_number" autocomplete="off" required maxlength="80" aria-describedby="registration_number-error">
          <p id="registration_number-error" class="field-error"></p>
        </div>
        <div class="field">
          <label for="assignment_title">Assignment title</label>
          <input id="assignment_title" name="assignment_title" required maxlength="200" aria-describedby="assignment_title-error">
          <p id="assignment_title-error" class="field-error"></p>
        </div>
        <div class="field">
          <label for="submission_url">Submission URL</label>
          <input id="submission_url" name="submission_url" type="url" inputmode="url" placeholder="https://example.com/my-assignment" required maxlength="2048" aria-describedby="submission_url-error">
          <p id="submission_url-error" class="field-error"></p>
        </div>
        <button id="submit-button" type="submit" disabled>Save submission</button>
      </form>
      <p id="form-status" role="status" aria-live="polite"></p>
    </section>
    <section aria-labelledby="list-heading" class="panel">
      <div class="section-heading">
        <h2 id="list-heading">Saved submissions</h2>
        <button id="refresh-button" class="secondary" type="button" disabled>Refresh list</button>
      </div>
      <p id="list-status" role="status" aria-live="polite"></p>
      <ul id="submission-list" class="submissions"></ul>
    </section>
    <footer>Local lab app. Avoid submitting sensitive personal information.</footer>
  </main>
</body>
</html>
